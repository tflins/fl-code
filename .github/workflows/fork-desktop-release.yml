name: Fork Desktop Release

on:
  push:
    branches: [main]
    tags:
      - "tflins-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing tflins-v* tag; leave empty to use the next published revision"
        required: false
        type: string
      publish:
        description: "Publish after local verification and CI checks (otherwise save Actions artifacts only)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tflins/fl-code'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      EXPLICIT_RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: tflins/fl-code
      # The fork updater replaces verified ZIPs itself; keep electron-updater feeds disabled.
      T3CODE_DESKTOP_DISABLE_UPDATE_FEED: "true"
      T3CODE_DESKTOP_SIGNED: "false"
      T3CODE_TELEMETRY_CHANNEL: dev
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # checkout's credential cleanup fails on orphaned gitlinks in .repos.
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ inputs.tag || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --tags origin '+refs/heads/main:refs/remotes/origin/main'
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach "$CHECKOUT_REF"

      - name: Prepare release metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$EXPLICIT_RELEASE_TAG" ]]; then
            node .github/scripts/fork-release.cjs metadata "$EXPLICIT_RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$PUBLISH" == "true" ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' \
              > "$RUNNER_TEMP/published-release-tags.txt"
            release_tag=$(node .github/scripts/fork-release.cjs next-tag "$RUNNER_TEMP/published-release-tags.txt")
            node .github/scripts/fork-release.cjs metadata "$release_tag"
          else
            node .github/scripts/fork-release.cjs verification-metadata "$GITHUB_SHA"
          fi

      - name: Validate release source
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if [[ -n "$EXPLICIT_RELEASE_TAG" ]]; then
            test "$(git rev-parse "refs/tags/$EXPLICIT_RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          upstream_tag=$(node -p "require('./.github/fork-release.json').upstreamTag")
          git fetch https://github.com/pingdotgg/t3code.git "refs/tags/$upstream_tag"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          git merge-base --is-ancestor HEAD origin/main
          printf 'RELEASE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter @t3tools/desktop... --filter t3... --filter @t3tools/web... --filter @t3tools/scripts...

      - name: Check release and packaging behavior
        working-directory: scripts
        run: |
          node --test ../.github/scripts/fork-release.test.cjs
          vp test run --config ../vite.config.ts --dir . build-desktop-artifact.test.ts update-release-package-versions.test.ts

      - name: Build desktop artifacts
        run: |
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 \
            --build-version "$RELEASE_VERSION" --output-dir release-fork --verbose

      - name: Verify shipped application
        run: |
          mkdir -p "$RUNNER_TEMP/fork-app"
          ditto -x -k "release-fork/T3-Code-$RELEASE_VERSION-arm64.zip" "$RUNNER_TEMP/fork-app"
          app="$RUNNER_TEMP/fork-app/FL Code (Nightly).app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Contents/Info.plist")" = "FL Code (Nightly)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$app/Contents/Info.plist")" = "FL Code (Nightly)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")" = "FL Code (Nightly)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.t3tools.t3code
          test ! -e "$app/Contents/Resources/app-update.yml"
          test -x "$app/Contents/MacOS/FL Code (Nightly)"
          for helper in \
            "FL Code (Nightly) Helper" \
            "FL Code (Nightly) Helper (GPU)" \
            "FL Code (Nightly) Helper (Plugin)" \
            "FL Code (Nightly) Helper (Renderer)"; do
            test -x "$app/Contents/Frameworks/$helper.app/Contents/MacOS/$helper"
          done
          node scripts/smoke-desktop-app.ts \
            --executable "$app/Contents/MacOS/FL Code (Nightly)" \
            --artifacts-dir "$RUNNER_TEMP/fork-launch-check"
          node .github/scripts/fork-release.cjs checksums "$RELEASE_VERSION" release-fork
          (cd release-fork && shasum -a 256 -c SHA256SUMS)

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-launch-check
          path: ${{ runner.temp }}/fork-launch-check
          if-no-files-found: ignore

      - name: Save verified installers
        uses: actions/upload-artifact@v7
        with:
          name: t3code-${{ env.RELEASE_VERSION }}-mac-arm64
          path: |
            release-fork/*.dmg
            release-fork/*.zip
            release-fork/SHA256SUMS
          if-no-files-found: error

      - name: Publish verified release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tflins-v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            node -e "if (!require(process.argv[1]).isDraft) throw new Error('Refusing to replace a published release')" "$RUNNER_TEMP/existing-release.json"
          else
            printf 'FL Code Nightly %s\n\n源码提交：%s\n\n上游每夜版：https://github.com/pingdotgg/t3code/releases/tag/%s\n完整保留上游版本号；后缀 -tflins.N 使用同一上游基线已发布版本的下一个连续序号。\n\n提供 macOS Apple Silicon DMG、ZIP 和 SHA256SUMS。未配置 Apple Developer ID 签名与公证。安装本次版本后，可使用应用内“检查更新”从 GitHub 下载并校验后续 ZIP，然后自动替换并重启。首次切换到支持更新的版本仍需手动安装。\n\n保留原应用 ID 和数据目录，应用包、可执行文件和用户可见名称统一为 FL Code (Nightly)。更新器会在首次升级时迁移旧包名。切换前请备份现有数据，不要同时运行两份应用操作同一数据目录。\n' "$RELEASE_VERSION" "$RELEASE_SHA" "$UPSTREAM_NIGHTLY_TAG" > "$RUNNER_TEMP/fork-release-notes.md"
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft \
              --title "FL Code Nightly $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/fork-release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "release-fork/T3-Code-$RELEASE_VERSION-arm64.dmg" \
            "release-fork/T3-Code-$RELEASE_VERSION-arm64.zip" \
            release-fork/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest=false
